# See https://pre-commit.com for more information
# To install run "pre-commit install"

# Ruff runs from the project environment (poetry.lock), so pre-commit, CI and local runs
# all use the same Ruff version. Requires "poetry install --with dev".

fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: poetry run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
