name: CI

# Checks only: no secrets, read-only token. Runs on the PR's own code (pull_request, not
# pull_request_target), so forks and Dependabot get real test results without access to secrets.
# Pushes to main and version tags run these checks via release.yml (workflow_call).
on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POETRY_VERSION: "2.5.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: poetry

      # Ruff comes from poetry.lock - the same version pre-commit uses (single source of truth).
      - name: Install lint dependencies
        run: poetry install --only dev --no-root

      - name: Ruff lint
        run: poetry run ruff check --output-format=github

      - name: Ruff format
        run: poetry run ruff format --check

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: |
          poetry env use python
          poetry install --with dev,test

      - name: Run unit tests
        run: poetry run test-unit

  # PR builds are kept as a workflow artifact instead of being published to PyPI.
  build-artifact:
    name: Build package artifact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set PR build version
        run: poetry version "$(poetry version --short)+pr${{ github.event.pull_request.number }}.${{ github.run_number }}"

      - name: Build the package
        run: poetry build

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-pr${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 14
