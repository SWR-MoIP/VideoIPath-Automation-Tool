# Example blueprint for Matrox ConvertIP devices (synthetic tag ids).
# Validate offline:  BlueprintEngine(app).validate(path)
schema_version: 1

inventory:
  default:
    driver_id: com.nevion.NMOS_multidevice-0.1.0
    generic_settings:
      enable_https: false
      http_auth: 0
    custom_settings:
      port: 8080
      disable_rx_sdp_with_null: true
      indices_in_ids: false

topology:
  default:
    device:
      icon_size: medium
    ip_vertex_mapping:
      stream-a: [P1]
      stream-b: [P2]
    vertex_processor:
      processor_type: matrox.convertip.default
      params:
        redundant_streams: true
        video_receiver_tags: [Format~~video-tag-a]
        video_sender_tags: [Format~~video-tag-b]
        audio_receiver_tags: [Format~~audio-tag-a]
        audio_sender_tags: [Format~~audio-tag-b]

  receiver:
    vertex_processor:
      params:
        mode: rx

  four-split:
    vertex_processor:
      params:
        mode: four_split
        video_receiver_tags: [Format~~video-tag-c]
